<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AR/VR DEM Viewer</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- We will create this js/dem-components.js file next -->
    <script src="js/dem-components.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loader {
            position: fixed; /* Use fixed for overlay */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: white;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 10001; /* Ensure it's above A-Frame canvas */
            display: none; /* Hidden by default, shown by component */
        }
    </style>
</head>
<body>
    <!-- Loader div from your original DEM viewer -->
    <div id="loader">Loading DEM...</div>

    <a-scene xr-mode-ui="XRMode:xr"
             background="color: #111122" <!-- Darker background for terrain -->
             antialias="true"
             renderer="colorManagement: true;" <!-- Important for correct colors with MeshStandardMaterial -->
             stats="false"
             debug="false"
             ui-wrapper="false">

        <!--
            The 'ar-scale-adjuster-wrapper' will use the ar-scale-adjuster component
            to handle scaling and positioning of its children in AR/VR.
            We'll place our DEM terrain inside this.
        -->
        <a-entity id="ar-scale-adjuster-wrapper"
                  ar-scale-adjuster="arScale: 0.05; vrScale: 0.5; arYOffset: 0; vrYOffset: 0; defaultPosVR: 0 -1 -3; defaultPosAR: 0 -0.5 -1.5">
            <!--
                This entity will hold our DEM terrain.
                The component 'dem-terrain' will be responsible for loading and creating it.
                Adjust demImagePath, planeSize, heightScale, and segments as needed.
            -->
            <a-entity id="dem-display"
                      dem-terrain="demImagePath: grayscale_raster.png;
                                   planeSize: 50;
                                   heightScale: 5;
                                   segments: 200;"
                      position="0 0 0">
            </a-entity>
        </a-entity>

        <!-- Camera Rig (similar to your solar system example) -->
        <a-entity id="rig" position="0 1.6 0">
            <a-camera look-controls="enabled: true; magicWindowTrackingEnabled: false"
                      wasd-controls="enabled: true">
            </a-camera>

            <!-- Optional: Controllers for future interactions (like VR zoom if you re-add it) -->
            <a-entity id="left-controller"
                     oculus-touch-controls="hand: left"
                     vive-controls="hand: left"
                     windows-motion-controls="hand: left"
                     generic-tracked-controller="hand: left"
                     visible="true">
            </a-entity>

            <a-entity id="right-controller"
                     oculus-touch-controls="hand: right"
                     vive-controls="hand: right"
                     windows-motion-controls="hand: right"
                     generic-tracked-controller="hand: right"
                     visible="true">
            </a-entity>
        </a-entity>

        <!-- Lighting - A-Frame lights will illuminate the DEM -->
        <a-light type="ambient" color="#888888" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1.0" position="-1 1.5 1"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="0.5" position="1 1 -1"></a-light>


        <!-- Optional: Stars background (can be nice for VR) -->
        <!-- <a-entity stars="count: 1000; radius: 100; color: #CCCCCC"></a-entity> -->

    </a-scene>
</body>
</html>
