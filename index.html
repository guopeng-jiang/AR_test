<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AR/VR DEM Viewer</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="js/dem-components.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: white;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 10001;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loader">Loading DEM...</div>

    <a-scene xr-mode-ui="XRMode:xr"
             background="color: #111122"
             antialias="true"
             renderer="colorManagement: true;"
             stats="false">

        <!-- Stars -->
        <a-entity stars="count: 2000; radius: 200; color: #FFFFFF"></a-entity>

        <a-entity id="ar-scale-adjuster-wrapper"
                  ar-scale-adjuster="arScale: 0.05; vrScale: 0.5; arYOffset: 0; vrYOffset: 0; defaultPosVR: 0 -1 -3; defaultPosAR: 0 -0.5 -1.5">
            
            <!-- DEM Terrain Display -->
            <!-- 
                 lake-ecosystem:
                 - fishCount: Number of fish
                 - plantCount: Number of plants on the bottom
                 - waterLevel: MUST match the level in water-helper (so fish stay under)
            -->
            <a-entity id="dem-display"
                      dem-terrain="demImagePath: grayscale_raster.png;
                                   maxSize: 50;
                                   heightScale: 10;
                                   segments: 200;"
                      water-helper="level: 2.5; color: #006994; opacity: 0.6; speed: 2.0;"
                      cloud-layer="altitude: 3.5; opacity: 0.4; speed: 0.1; scale: 2.0;"
                      position="0 0 0">
            </a-entity>

        </a-entity>

        <!-- Camera Rig -->
        <a-entity id="rig" position="0 1.6 0"
                  movement-controls="speed: 0.5; fly: true;">
            
            <a-camera look-controls="enabled: true; magicWindowTrackingEnabled: false" position="0 0 0"></a-camera>

            <a-entity id="left-controller"
                      oculus-touch-controls="hand: left; model: true;"
                      vive-controls="hand: left; model: true;"
                      windows-motion-controls="hand: left; model: true;"
                      visible="true">
            </a-entity>

            <a-entity id="right-controller"
                      oculus-touch-controls="hand: right; model: true;"
                      vive-controls="hand: right; model: true;"
                      windows-motion-controls="hand: right; model: true;"
                      vr-dem-zoom="targetEl: #ar-scale-adjuster-wrapper; speed: 1.5;"
                      visible="true">
            </a-entity>
        </a-entity>

        <a-light type="ambient" color="#888888" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1.0" position="-1 1.5 1"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="0.5" position="1 1 -1"></a-light>
    </a-scene>
</body>
</html>
