<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AR/VR DEM Viewer</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="js/dem-components.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: white;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 10001;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loader">Loading DEM...</div>

    <a-scene xr-mode-ui="XRMode:xr"
             background="color: #111122"
             antialias="true"
             renderer="colorManagement: true;"
             stats="false">

        <!-- Stars -->
        <a-entity stars="count: 2000; radius: 200; color: #FFFFFF"></a-entity>

        <a-entity id="ar-scale-adjuster-wrapper"
                  ar-scale-adjuster="arScale: 0.05; vrScale: 0.5; arYOffset: 0; vrYOffset: 0; defaultPosVR: 0 -1 -3; defaultPosAR: 0 -0.5 -1.5">
            
            <!-- DEM Terrain Display -->
            <!-- 
                 Updates:
                 - visualizeDepth: true
                 - landColor: #4B4642
                 - shallowColor: #76B6C4
                 - deepColor: #001E36
                 - waterLevel: 2.5 (Matches water-helper)
            -->
            <a-entity id="dem-display"
                      dem-terrain="demImagePath: grayscale_raster.png;
                                   maxSize: 100;
                                   heightScale: 10;
                                   segments: 200;
                                   visualizeDepth: true;
                                   landColor: #4B4642;
                                   shallowColor: #76B6C4;
                                   deepColor: #001E36;
                                   waterLevel: 6;
                                   useImageAsTexture: false;"
                      water-helper="level: 9; color: #76B6C4; opacity: 0.5; speed: 1;"
                      cloud-layer="altitude: 10; opacity: 0.4; speed: 0.1; scale: 2.0;"
                      floating-ice="count: 100; minSize: 0.01; maxSize: 1; waterLevel: 9;"
                      position="0 0 0">
            </a-entity>

            <!-- Depth Legend Panel -->
            <!-- Placed to the left of the terrain -->
            <a-entity position="-28 3 0" 
                      rotation="0 20 0" 
                      scale="5 5 5"
                      depth-legend="title: Depth Map; minLabel: 0m; maxLabel: -243m; shallowColor: #76B6C4; deepColor: #001E36;">
            </a-entity>

            <!-- Info Side Panel (Existing) -->
            <a-entity position="35 8 5" rotation="0 -20 0">
                <a-plane width="22" height="16" color="#050505" opacity="0.85" material="side: double"></a-plane>
                <a-text value="Tasman Lake" color="#76B6C4" align="center" position="0 6 0.1" width="30" font="kelsonsans"></a-text>
                <a-text value="Tasman Lake is a young, growing proglacial lake in Aoraki / Mount Cook National Park that formed due to the rapid retreat of the Tasman Glacier. Icebergs often float in its milky grey water, which is caused by suspended fine rock powder ground by the glacier." 
                        color="#FFF" align="left" position="-10 3.5 0.1" width="20" wrap-count="42" baseline="top"></a-text>
                <a-text value="Surface elevation: 715 m\nArea: 195 ha\nMax. depth: 243 m \nLocation: Aoraki / Mount Cook National Park\nMax. length: 7 km" 
                        color="#CCC" align="left" position="-10 -1.5 0.1" width="20" wrap-count="42" baseline="top" line-height="60"></a-text>
            </a-entity>

        </a-entity>

        <!-- Camera Rig -->
        <a-entity id="rig" position="0 1.6 0"
                  movement-controls="speed: 0.5; fly: true;">
            
            <a-camera look-controls="enabled: true; magicWindowTrackingEnabled: false" position="0 0 0"></a-camera>

            <a-entity id="left-controller"
                      oculus-touch-controls="hand: left; model: true;"
                      vive-controls="hand: left; model: true;"
                      windows-motion-controls="hand: left; model: true;"
                      visible="true">
            </a-entity>

            <a-entity id="right-controller"
                      oculus-touch-controls="hand: right; model: true;"
                      vive-controls="hand: right; model: true;"
                      windows-motion-controls="hand: right; model: true;"
                      vr-dem-zoom="targetEl: #ar-scale-adjuster-wrapper; speed: 1.5;"
                      visible="true">
            </a-entity>
        </a-entity>

        <a-light type="ambient" color="#888888" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="1.0" position="-1 1.5 1"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="0.5" position="1 1 -1"></a-light>
    </a-scene>
</body>
</html>
